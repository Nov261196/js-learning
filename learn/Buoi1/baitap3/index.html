<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính Năm Sinh Từ Tuổi</title>
</head>
<body>

        <label for="hoten">Họ và Tên:</label><br>
        <input type="text" id="hoten"><br><br>
