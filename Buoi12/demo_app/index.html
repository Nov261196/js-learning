<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStore Admin Dashboard | Buổi 16: Async/Await & JSON-Server</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="container nav-container">
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <h1>TechStore Admin <span>Buổi 16</span></h1>
      </div>
      <div class="server-status">
        <div id="server-dot" class="status-dot"></div>
        <span id="server-text">Đang kiểm tra máy chủ...</span>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="container">
    <!-- HERO TITLE -->
    <section class="hero-banner">
      <h2>Quản Lý Danh Mục & Sản Phẩm</h2>
      <p>Ứng dụng thực chiến minh họa kiến trúc API Client với <strong>Async/Await</strong>, <strong>Fetch API</strong> và <strong>JSON-Server</strong>.</p>
    </section>

    <!-- CONTROLS & TOOLBAR -->
    <section class="toolbar-card">
      <div class="filter-group">
        <!-- SEARCH -->
        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" class="search-input" placeholder="Tìm kiếm theo tên sản phẩm (Debounce 400ms)...">
        </div>

        <!-- CATEGORY FILTER -->
        <select id="category-filter" class="select-control">
          <option value="">Đang tải danh mục...</option>
        </select>

        <!-- SORTING -->
        <select id="sort-select" class="select-control">
          <option value="id-asc">Sắp xếp: Mặc định (ID tăng)</option>
          <option value="price-asc">Giá: Thấp đến Cao ↑</option>
          <option value="price-desc">Giá: Cao đến Thấp ↓</option>
          <option value="rating-desc">Đánh giá: Cao nhất ⭐</option>
          <option value="name-asc">Tên sản phẩm: A → Z</option>
        </select>
      </div>

      <div style="display: flex; gap: 10px;">
        <button id="btn-refresh" class="btn btn-outline" title="Làm mới bảng dữ liệu">🔄 Làm mới</button>
        <button id="btn-open-add-modal" class="btn btn-primary">➕ Thêm Sản Phẩm</button>
      </div>
    </section>

    <!-- DATA TABLE SECTION -->
    <section class="table-card">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th style="width: 60px;">STT</th>
              <th>Sản phẩm</th>
              <th style="width: 150px;">Đơn giá</th>
              <th style="width: 180px;">Danh mục</th>
              <th style="width: 130px;">Trạng thái</th>
              <th style="width: 170px; text-align: center;">Hành động</th>
            </tr>
          </thead>
          <tbody id="product-tbody">
            <!-- Skeleton rows will be inserted here via JavaScript -->
          </tbody>
        </table>
      </div>

      <!-- PAGINATION CONTROLS -->
      <div class="pagination-wrapper">
        <div id="page-info" class="page-info">Đang tính toán phân trang...</div>
        <div class="page-nav">
          <button id="btn-prev" class="btn btn-outline btn-sm" disabled>← Trang trước</button>
          <button id="btn-next" class="btn btn-outline btn-sm" disabled>Trang sau →</button>
        </div>
      </div>
    </section>
  </main>

  <!-- MODAL FORM (ADD / EDIT PRODUCT) -->
  <div id="modal-backdrop" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-title" class="modal-title">Thêm Sản Phẩm Mới</h3>
        <button id="btn-close-modal" class="modal-close">&times;</button>
      </div>
      <form id="product-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="form-name">Tên sản phẩm (*)</label>
            <input type="text" id="form-name" class="form-input" placeholder="Nhập tên sản phẩm (vd: MacBook Pro M3...)" required>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
            <div class="form-group">
              <label class="form-label" for="form-price">Giá bán (VNĐ) (*)</label>
              <input type="number" id="form-price" class="form-input" placeholder="vd: 25000000" min="1000" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="form-category">Danh mục (*)</label>
              <select id="form-category" class="form-input" required>
                <option value="">-- Chọn danh mục --</option>
              </select>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
            <div class="form-group">
              <label class="form-label" for="form-stock-quantity">Số lượng tồn kho</label>
              <input type="number" id="form-stock-quantity" class="form-input" value="10" min="0">
            </div>
            <div class="form-group" style="display: flex; align-items: flex-end; padding-bottom: 10px;">
              <label class="form-checkbox-label">
                <input type="checkbox" id="form-instock" checked>
                <span>Đang kinh doanh (Còn hàng)</span>
              </label>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="form-image">Đường dẫn ảnh (URL Image)</label>
            <input type="url" id="form-image" class="form-input" placeholder="https://images.unsplash.com/...">
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" id="btn-cancel-modal" class="btn btn-outline">Hủy bỏ</button>
          <button type="submit" id="btn-submit-modal" class="btn btn-primary">Lưu Sản Phẩm</button>
        </div>
      </form>
    </div>
  </div>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toast-container"></div>

  <!-- JAVASCRIPT MODULE -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
